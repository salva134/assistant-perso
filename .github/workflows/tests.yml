# Vérifie Marcus à chaque envoi sur GitHub : style du code et tests.
# Les tests de la base (tests/test_base.py) sont sautés : GitHub n'a pas, et ne doit pas avoir, les codes du .env.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]  # 3.12 : un serveur Ubuntu ; 3.13 : le PC d'Hugo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Installer les dépendances (versions exactes)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt ruff==0.17.2

      - name: Style du code (ruff)
        run: ruff check app scripts tests

      - name: Tests
        env:
          SKIP_DB_TESTS: "1"
        run: pytest -q
